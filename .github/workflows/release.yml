name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin metadata
        id: meta
        run: |
          NAME=$(jq -r '.name' plugin.json)
          VERSION=$(jq -r '.version' plugin.json)
          echo "name=${NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip=${NAME}-${VERSION}.zip" >> $GITHUB_OUTPUT

      - name: Validate tag matches plugin.json version
        run: |
          JSON_VERSION="${{ steps.meta.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${{ github.ref_name }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
              echo "ERROR: tag version '${TAG_VERSION}' does not match plugin.json version '${JSON_VERSION}'"
              exit 1
            fi
            echo "Version match: ${JSON_VERSION} ✓"
          else
            echo "Manual trigger — creating tag v${JSON_VERSION}..."
            if git ls-remote --tags origin "v${JSON_VERSION}" | grep -q "v${JSON_VERSION}"; then
              echo "Tag v${JSON_VERSION} already exists on remote, skipping push."
            else
              git tag "v${JSON_VERSION}"
              git push origin "v${JSON_VERSION}"
            fi
          fi

      - name: Create zip
        run: |
          zip -r "${{ steps.meta.outputs.zip }}" . \
            -x '.git/*' \
            -x '__pycache__/*' \
            -x '**/__pycache__/*' \
            -x '*.pyc' \
            -x '.pytest_cache/*' \
            -x '.github/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          overwrite: true
          tag_name: "v${{ steps.meta.outputs.version }}"
          name: "${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}"
          files: "${{ steps.meta.outputs.zip }}"
          generate_release_notes: true

      - name: Sync code & tags to Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_PASS: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_USER}" ] || [ -z "${GITEE_PASS}" ]; then
            echo "GITEE_USERNAME or GITEE_TOKEN not set, skipping Gitee sync."
            exit 0
          fi
          REPO_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_LOWER="${REPO_LOWER,,}"
          printf '#!/bin/sh\necho "${GIT_PASSWORD}"\n' > /tmp/git-askpass.sh
          chmod +x /tmp/git-askpass.sh
          export GIT_PASSWORD="${GITEE_PASS}"
          export GIT_ASKPASS=/tmp/git-askpass.sh
          git push "https://${GITEE_USER}@gitee.com/KBEngineLab/${REPO_LOWER}.git" --all
          git push "https://${GITEE_USER}@gitee.com/KBEngineLab/${REPO_LOWER}.git" --tags --force

      - name: Create Gitee Release
        id: gitee_release
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_LOWER="${REPO_LOWER,,}"
          RESPONSE=$(curl -s -X POST "https://gitee.com/api/v5/repos/KBEngineLab/${REPO_LOWER}/releases" \
            -H "Content-Type: application/json" \
            -d "{
              \"access_token\": \"${{ secrets.GITEE_TOKEN }}\",
              \"tag_name\": \"v${{ steps.meta.outputs.version }}\",
              \"target_commitish\": \"main\",
              \"name\": \"${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}\",
              \"body\": \"${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }}\"
            }")
          echo "response=${RESPONSE}" >> $GITHUB_OUTPUT
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          if echo "$RESPONSE" | jq -e '.message' | grep -qi 'already'; then
            echo "Gitee release already exists, skipping."
            exit 0
          fi
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create Gitee release: $RESPONSE"
            exit 1
          fi
          echo "Gitee release created: id=${RELEASE_ID}"

      - name: Upload zip to Gitee Release
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY##*/}"
          REPO_LOWER="${REPO_LOWER,,}"
          curl -s -X POST \
            "https://gitee.com/api/v5/repos/KBEngineLab/${REPO_LOWER}/releases/${{ steps.gitee_release.outputs.release_id }}/attach_files" \
            -F "access_token=${{ secrets.GITEE_TOKEN }}" \
            -F "file=@${{ steps.meta.outputs.zip }}"


